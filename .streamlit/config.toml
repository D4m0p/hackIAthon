[theme]
base = "light"
primaryColor = "#12566A"
backgroundColor = "#EFF4F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16262C"
font = "'Source Sans 3':https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
baseRadius = "0.75rem"
# Azul y cálido están validados para daltonismo y contraste; no los cambie
# sin volver a comprobarlos.
chartCategoricalColors = ["#00719B", "#BE6B26", "#35915F", "#A87515"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
